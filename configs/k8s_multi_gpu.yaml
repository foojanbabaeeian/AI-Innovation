# Config for Kubernetes CPU-parallel training.
# K8s handles parallel preprocessing across pods;
# training runs on a single pod with multi-core CPU parallelism.

data:
  manifest_path: "/mnt/data/metadata/master_manifest.csv"
  data_root: "/mnt/data"
  target_sr: 16000
  segment_length: 64000
  batch_size: 32
  num_workers: 16         # parallel data loading across CPU cores
  augment_prob: 0.5
  threshold_low: 0.2
  threshold_high: 0.8

model:
  embed_dim: 128
  num_attention_heads: 4
  num_attention_layers: 2
  num_classes: 3
  ssl_model_name: "microsoft/wavlm-base-plus"
  freeze_ssl_feature_extractor: true
  dropout: 0.1

training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_steps: 1000
  loss_alpha: 0.5
  grad_clip_norm: 1.0
  early_stopping_patience: 10
  scheduler: "cosine"
  mixed_precision: false
  gradient_accumulation_steps: 4

logging:
  output_dir: "/mnt/outputs"
  experiment_name: "ai_audio_detection_k8s"
  log_every_n_steps: 50
  eval_every_n_epochs: 1
  save_top_k: 3
  wandb_project: "ai-audio-detection"
  wandb_enabled: false
